<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Path Animator (Fixed)</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      textarea {
        width: 100%;
        height: 150px;
      }
      svg {
        width: 100%;
        height: auto;
        border: 1px solid #ccc;
        margin-top: 20px;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>SVG Path Animator</h2>
    <p>Paste SVG paths (one per line):</p>
    <textarea id="pathsInput"></textarea>
    <br /><br />
    <button id="generateBtn">Generate & Animate</button>
    <button id="generateSmoothBtn">Generate, Smooth & Animate</button>
    <br /><br />
    <svg
      id="svgCanvas"
      width="200"
      height="200"
      viewBox="0 0 200 200"
      xmlns="http://www.w3.org/2000/svg"
    ></svg>

    <h3>Generated SVG Code:</h3>
    <pre
      id="svgOutput"
      style="
        white-space: pre-wrap;
        background: #f4f4f4;
        padding: 10px;
        border: 1px solid #ccc;
      "
    ></pre>

    <script src="script.js"></script>
  </body>
</html>
